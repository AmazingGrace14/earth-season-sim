<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>정밀 지구본 기반 계절 변화 시뮬레이터</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #010409; color: #ffffff;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      overflow: hidden; display: flex; flex-direction: column; user-select: none;
    }
    #canvas-container {
      flex: 1 1 auto; width: 100%; height: calc(100vh - 65px);
      position: relative; overflow: hidden;
    }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #controls {
      flex: 0 0 65px; height: 65px; width: 100%;
      background: #0f172a; border-top: 1.5px solid #334155;
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 10px; padding: 0 15px; z-index: 10;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.6); overflow-x: auto; white-space: nowrap;
    }
    .ctrl-group { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; }
    .divider { width: 1px; height: 28px; background-color: #334155; margin: 0 4px; }
    input[type=range] { width: 130px; cursor: pointer; }
    button {
      background: #2563eb; color: white; border: none; padding: 7px 11px;
      border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12.5px;
      transition: all 0.2s ease; white-space: nowrap;
    }
    button:hover { background: #1d4ed8; transform: translateY(-1px); }
    .toggle-btn { background: #059669; }
    .toggle-btn:hover { background: #047857; }
    .season-btn { background: #334155; }
    .season-btn:hover { background: #475569; }
    .all-seasons-btn { background: #8b5cf6; }
    .all-seasons-btn:hover { background: #7c3aed; }
    .all-seasons-btn.active { background: #ec4899; box-shadow: 0 0 10px rgba(236, 72, 153, 0.6); }

    /* 좌측 상단 안내창 */
    #labels {
      position: absolute; top: 6px; left: 6px; font-size: 12px; color: #f1f5f9;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
      padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(51, 65, 85, 0.8);
      line-height: 1.5; max-width: 320px; box-shadow: 0 4px 14px rgba(0,0,0,0.6); z-index: 5;
    }
    .label-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
    .header-title-box { display: flex; flex-direction: column; gap: 2px; }
    .label-content { margin-top: 5px; border-top: 1px solid #1e293b; padding-top: 5px; }
    .creator-tag { font-size: 10.5px; color: #38bdf8; font-weight: 600; }
    .fold-btn {
      background: transparent; border: 1px solid #475569; color: #94a3b8;
      font-size: 10px; padding: 1px 5px; border-radius: 4px;
    }

    /* 우측 상단: [핵심] 태양 남중고도 및 에너지 밀도 HUD 패널 */
    #solarHUD {
      position: absolute; top: 6px; right: 6px; font-size: 12px; color: #f8fafc;
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      padding: 10px 14px; border-radius: 8px; border: 1.5px solid #38bdf8;
      width: 280px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); z-index: 5;
    }
    .hud-title { font-weight: bold; font-size: 13px; color: #38bdf8; margin-bottom: 6px; border-bottom: 1px solid #334155; padding-bottom: 4px; display: flex; justify-content: space-between; }
    .hud-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .hud-val { font-weight: bold; }
    .hud-bar-bg { width: 100%; height: 10px; background: #1e293b; border-radius: 5px; overflow: hidden; margin-top: 4px; }
    .hud-bar-fill { height: 100%; width: 50%; background: linear-gradient(90deg, #3b82f6, #f59e0b, #ef4444); transition: width 0.1s linear; }
    .hud-desc { font-size: 10.5px; color: #cbd5e1; margin-top: 6px; line-height: 1.35; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container">
    <div id="labels">
      <div class="label-header" onclick="toggleNotice()">
        <div class="header-title-box">
          <b>🌏 계절의 변화 (북반구 대한민국 기준)</b>
          <span class="creator-tag">✨ Made by AmazingGrace14</span>
        </div>
        <button id="foldBtn" class="fold-btn">접기</button>
      </div>
      <div id="noticeBody" class="label-content">
        • 🔴 <b>빨간 핀</b>: 대한민국 위치 (위도 37.5°N)<br>
        • 🟡 <b>노란 광선</b>: 태양 직사광선 입사각<br>
        • 드래그: 3D 회전 | 휠: 확대·축소<br>
        <span style="color:#f59e0b; font-size:10.5px;">※ 북극 상공 기준 반시계 방향(서→동) 공전</span>
      </div>
    </div>

    <!-- 우측 상단 실시간 남중고도 및 에너지 밀도 HUD -->
    <div id="solarHUD">
      <div class="hud-title">
        <span>☀️ 남중고도 및 태양 에너지</span>
        <span id="hudSeasonBadge" style="color:#facc15;">여름 (하지)</span>
      </div>
      <div class="hud-row">
        <span>태양 남중고도:</span>
        <span id="altitudeVal" class="hud-val" style="color:#38bdf8;">76.0° (높음)</span>
      </div>
      <div class="hud-row">
        <span>단위면적당 에너지:</span>
        <span id="energyVal" class="hud-val" style="color:#f87171;">97% (매우 강함)</span>
      </div>
      <div class="hud-bar-bg">
        <div id="energyBar" class="hud-bar-fill" style="width: 97%;"></div>
      </div>
      <div id="hudExplain" class="hud-desc">
        햇빛이 수직에 가깝게 내리쬐어 좁은 면적에 많은 에너지가 집중됩니다 (기온 높음).
      </div>
    </div>
  </div>

  <div id="controls">
    <div class="ctrl-group">
      <label for="tiltSlider">자전축 기울기: <strong id="tiltVal" style="color: #38bdf8;">23.5</strong>°</label>
      <input type="range" id="tiltSlider" min="0" max="90" step="0.5" value="23.5">
      <button onclick="setTilt(0)">0° (직각)</button>
      <button onclick="setTilt(23.5)">23.5° (실제)</button>
    </div>

    <div class="divider"></div>

    <div class="ctrl-group">
      <button id="camModeBtn" class="toggle-btn" onclick="toggleCameraMode()">직교(Ortho) 전환</button>
      <button id="playBtn" onclick="togglePlay()">공전 일시정지</button>
    </div>

    <div class="divider"></div>

    <div class="ctrl-group">
      <button class="season-btn" onclick="moveToSeason(Math.PI / 2)">여름 (하지)</button>
      <button class="season-btn" onclick="moveToSeason(0)">가을 (추분)</button>
      <button class="season-btn" onclick="moveToSeason(3 * Math.PI / 2)">겨울 (동지)</button>
      <button class="season-btn" onclick="moveToSeason(Math.PI)">봄 (춘분)</button>
      <button id="allSeasonsBtn" class="all-seasons-btn" onclick="toggleAllSeasons()">✨ 사계절 동시 보기</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const tiltSlider = document.getElementById('tiltSlider');
    const tiltVal = document.getElementById('tiltVal');
    const playBtn = document.getElementById('playBtn');
    const camModeBtn = document.getElementById('camModeBtn');
    const allSeasonsBtn = document.getElementById('allSeasonsBtn');
    const noticeBody = document.getElementById('noticeBody');
    const foldBtn = document.getElementById('foldBtn');

    // HUD 요소
    const altitudeVal = document.getElementById('altitudeVal');
    const energyVal = document.getElementById('energyVal');
    const energyBar = document.getElementById('energyBar');
    const hudExplain = document.getElementById('hudExplain');
    const hudSeasonBadge = document.getElementById('hudSeasonBadge');

    let isPlaying = true;
    let orbitAngle = Math.PI / 2;
    let tiltDegree = 23.5;
    const orbitRadius = 46;
    let isOrtho = false;
    let isNoticeFolded = false;
    let isAllSeasonsMode = false;

    window.toggleNotice = function() {
      isNoticeFolded = !isNoticeFolded;
      noticeBody.style.display = isNoticeFolded ? 'none' : 'block';
      foldBtn.innerText = isNoticeFolded ? '펼치기' : '접기';
    };

    // 1. Scene & Renderer
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    // 2. Dual Camera
    function getContainerSize() {
      const rect = container.getBoundingClientRect();
      const w = Math.max(rect.width, 1);
      const h = Math.max(rect.height, 1);
      return { width: w, height: h, aspect: w / h };
    }

    const initSize = getContainerSize();
    const persCamera = new THREE.PerspectiveCamera(18, initSize.aspect, 5, 4500);
    persCamera.position.set(0, 65, 175);

    const orthoFrustum = 38;
    const orthoCamera = new THREE.OrthographicCamera(
      -orthoFrustum * initSize.aspect, orthoFrustum * initSize.aspect,
      orthoFrustum, -orthoFrustum, 5, 4500
    );
    orthoCamera.position.set(0, 65, 175);
    let activeCamera = persCamera;

    let controls = new THREE.OrbitControls(activeCamera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;

    function resizeRenderer() {
      const size = getContainerSize();
      renderer.setSize(size.width, size.height, false);
      persCamera.aspect = size.aspect;
      persCamera.updateProjectionMatrix();
      orthoCamera.left = -orthoFrustum * size.aspect;
      orthoCamera.right = orthoFrustum * size.aspect;
      orthoCamera.top = orthoFrustum;
      orthoCamera.bottom = -orthoFrustum;
      orthoCamera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeRenderer);
    setTimeout(resizeRenderer, 50);

    function updateCameraSettings() {
      controls.object = activeCamera;
      activeCamera.lookAt(0, 0, 0);
      controls.update();
    }

    // 3. 우주 배경 돔 & 별빛
    function createMilkyWayTexture() {
      const c = document.createElement('canvas');
      c.width = 2048; c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#02040a';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.save();
      ctx.translate(c.width / 2, c.height / 2);
      ctx.rotate(-Math.PI / 7);
      const clouds = [
        { color: 'rgba(30, 58, 138, 0.45)', w: 1600, h: 260, y: 0 },
        { color: 'rgba(56, 189, 248, 0.28)', w: 1200, h: 180, y: -25 },
        { color: 'rgba(147, 51, 234, 0.32)', w: 1400, h: 220, y: 20 },
        { color: 'rgba(236, 72, 153, 0.22)', w: 900,  h: 150, y: -10 }
      ];
      clouds.forEach(cl => {
        const radGrad = ctx.createRadialGradient(0, cl.y, 10, 0, cl.y, cl.w / 2);
        radGrad.addColorStop(0, cl.color);
        radGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = radGrad;
        ctx.beginPath();
        ctx.ellipse(0, cl.y, cl.w / 2, cl.h / 2, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
      return new THREE.CanvasTexture(c);
    }
    const universeSkyMesh = new THREE.Mesh(
      new THREE.SphereGeometry(1500, 48, 48),
      new THREE.MeshBasicMaterial({ map: createMilkyWayTexture(), side: THREE.BackSide, depthWrite: false })
    );
    scene.add(universeSkyMesh);

    // 4. 공전 궤도
    class OrbitCurve extends THREE.Curve {
      constructor(radius) { super(); this.radius = radius; }
      getPoint(t) {
        const u = t * 2 * Math.PI;
        return new THREE.Vector3(this.radius * Math.cos(u), 0, this.radius * Math.sin(u));
      }
    }
    const orbitMesh = new THREE.Mesh(
      new THREE.TubeGeometry(new OrbitCurve(orbitRadius), 160, 0.22, 8, true),
      new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.8 })
    );
    scene.add(orbitMesh);

    // 5. 태양
    const textureLoader = new THREE.TextureLoader();
    const sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(8.5, 64, 64),
      new THREE.MeshBasicMaterial({
        map: textureLoader.load('https://upload.wikimedia.org/wikipedia/commons/9/99/Map_of_the_full_sun.jpg'),
        color: 0xffea75
      })
    );
    scene.add(sunMesh);

    const sunLight = new THREE.PointLight(0xffffff, 3.4, 550, 0.2);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x384556, 0.78));

    // 6. 지구 단위 생성기 (한국 관측 핀 + 지평면 판 + 입사광 레이저)
    const earthMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');
    const earthNormal = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_normal_2048.jpg');
    const earthSpecular = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_specular_2048.jpg');

    const earthRadius = 5.2;
    const axisLength = 18.0;

    function createEarthUnit(labelText, isInteractiveMain = false) {
      const pivot = new THREE.Group();
      const tiltGroup = new THREE.Group();
      pivot.add(tiltGroup);

      const earthMat = new THREE.MeshPhongMaterial({
        map: earthMap, normalMap: earthNormal, specularMap: earthSpecular,
        specular: new THREE.Color(0x282828), shininess: 14,
        emissive: new THREE.Color(0x0e1320), emissiveMap: earthMap
      });
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(earthRadius, 128, 128), earthMat);
      tiltGroup.add(mesh);

      // 적도선
      const eqCurve = new THREE.EllipseCurve(0, 0, earthRadius + 0.04, earthRadius + 0.04, 0, 2 * Math.PI, false, 0);
      const equator = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(eqCurve.getPoints(96)),
        new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 2 })
      );
      equator.rotation.x = Math.PI / 2;
      tiltGroup.add(equator);

      // 자전축
      const axis = new THREE.Mesh(
        new THREE.CylinderGeometry(0.12, 0.12, axisLength, 16),
        new THREE.MeshBasicMaterial({ color: 0x22c55e })
      );
      tiltGroup.add(axis);

      // 북극 N 라벨
      const canvasN = document.createElement('canvas');
      canvasN.width = 64; canvasN.height = 64;
      const ctxN = canvasN.getContext('2d');
      ctxN.fillStyle = '#22c55e'; ctxN.font = 'bold 50px sans-serif';
      ctxN.textAlign = 'center'; ctxN.textBaseline = 'middle'; ctxN.fillText('N', 32, 32);
      const nSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvasN) }));
      nSprite.position.set(0, axisLength / 2 + 1.2, 0);
      nSprite.scale.set(2.8, 2.8, 1);
      tiltGroup.add(nSprite);

      // [핵심] 대한민국 관측 지점 (위도 37.5°N) 핀 및 지평면
      const koreaLat = THREE.MathUtils.degToRad(37.5);
      const koreaR = earthRadius + 0.06;
      // 기준 좌표: y는 북쪽, z축 방향이 남중 정오 자오선
      const koreaPos = new THREE.Vector3(0, koreaR * Math.sin(koreaLat), koreaR * Math.cos(koreaLat));

      const pinGroup = new THREE.Group();
      pinGroup.position.copy(koreaPos);

      // 지평면 판 (노란색 원형 판)
      const groundPlate = new THREE.Mesh(
        new THREE.CircleGeometry(1.2, 32),
        new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide, transparent: true, opacity: 0.65 })
      );
      // 지평면이 지구 표면에 접하도록 회전
      groundPlate.rotation.x = -Math.PI / 2 + koreaLat;
      pinGroup.add(groundPlate);

      // 빨간색 관측 핀 막대
      const pinRod = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1, 0.1, 2.4, 16),
        new THREE.MeshBasicMaterial({ color: 0xef4444 })
      );
      pinRod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), koreaPos.clone().normalize());
      pinRod.position.add(koreaPos.clone().normalize().multiplyScalar(1.2));
      pinGroup.add(pinRod);

      tiltGroup.add(pinGroup);

      // [선택적] 태양 직사광 레이저 선 (메인 지구용)
      let sunBeamLine = null;
      if (isInteractiveMain) {
        const beamGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        const beamMat = new THREE.LineBasicMaterial({ color: 0xfde047, linewidth: 3, transparent: true, opacity: 0.9 });
        sunBeamLine = new THREE.Line(beamGeo, beamMat);
        scene.add(sunBeamLine);
      }

      // 계절 라벨
      if (labelText) {
        const cLabel = document.createElement('canvas');
        cLabel.width = 300; cLabel.height = 70;
        const ctxL = cLabel.getContext('2d');
        ctxL.fillStyle = '#f8fafc'; ctxL.font = 'bold 32px sans-serif';
        ctxL.textAlign = 'center'; ctxL.textBaseline = 'middle';
        ctxL.fillText(labelText, 150, 35);
        const labelSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cLabel) }));
        labelSprite.position.set(0, -earthRadius - 3.8, 0);
        labelSprite.scale.set(11, 2.6, 1);
        pivot.add(labelSprite);
      }

      return { pivot, tiltGroup, mesh, pinGroup, sunBeamLine, koreaPos };
    }

    // 메인 지구
    const mainEarth = createEarthUnit(null, true);
    scene.add(mainEarth.pivot);

    // 사계절 고정 4개 지구
    const fourSeasonsGroup = new THREE.Group();
    scene.add(fourSeasonsGroup);
    fourSeasonsGroup.visible = false;

    const seasonConfigs = [
      { angle: Math.PI / 2, label: "여름 (하지)" },
      { angle: 0, label: "가을 (추분)" },
      { angle: 3 * Math.PI / 2, label: "겨울 (동지)" },
      { angle: Math.PI, label: "봄 (춘분)" }
    ];

    const staticEarths = seasonConfigs.map(cfg => {
      const unit = createEarthUnit(cfg.label, false);
      unit.pivot.position.x = orbitRadius * Math.cos(cfg.angle);
      unit.pivot.position.z = orbitRadius * Math.sin(cfg.angle);
      fourSeasonsGroup.add(unit.pivot);
      return unit;
    });

    function applyAllTilts(deg) {
      const rad = -THREE.MathUtils.degToRad(deg);
      mainEarth.tiltGroup.rotation.z = rad;
      staticEarths.forEach(u => u.tiltGroup.rotation.z = rad);
    }
    applyAllTilts(tiltDegree);

    // UI 이벤트 리스너
    tiltSlider.addEventListener('input', (e) => {
      tiltDegree = parseFloat(e.target.value);
      tiltVal.innerText = tiltDegree;
      applyAllTilts(tiltDegree);
    });

    window.setTilt = function(val) {
      tiltDegree = val;
      tiltSlider.value = val;
      tiltVal.innerText = val;
      applyAllTilts(val);
    };

    window.togglePlay = function() {
      if (isAllSeasonsMode) toggleAllSeasons();
      isPlaying = !isPlaying;
      playBtn.innerText = isPlaying ? "공전 일시정지" : "공전 시작";
    };

    window.moveToSeason = function(angle) {
      if (isAllSeasonsMode) toggleAllSeasons();
      orbitAngle = angle;
    };

    window.toggleAllSeasons = function() {
      isAllSeasonsMode = !isAllSeasonsMode;
      if (isAllSeasonsMode) {
        isPlaying = false;
        playBtn.innerText = "공전 시작";
        mainEarth.pivot.visible = false;
        mainEarth.sunBeamLine.visible = false;
        fourSeasonsGroup.visible = true;
        allSeasonsBtn.classList.add('active');
        allSeasonsBtn.innerText = "단일 공전 보기";
      } else {
        mainEarth.pivot.visible = true;
        mainEarth.sunBeamLine.visible = true;
        fourSeasonsGroup.visible = false;
        allSeasonsBtn.classList.remove('active');
        allSeasonsBtn.innerText = "✨ 사계절 동시 보기";
      }
    };

    window.toggleCameraMode = function() {
      isOrtho = !isOrtho;
      if (isOrtho) {
        orthoCamera.position.copy(persCamera.position);
        orthoCamera.quaternion.copy(persCamera.quaternion);
        activeCamera = orthoCamera;
        camModeBtn.innerText = "원근(Persp) 전환";
      } else {
        persCamera.position.copy(orthoCamera.position);
        persCamera.quaternion.copy(orthoCamera.quaternion);
        activeCamera = persCamera;
        camModeBtn.innerText = "직교(Ortho) 전환";
      }
      updateCameraSettings();
    };

    // =========================================================================
    // 7. 실시간 남중고도 및 에너지 밀도 계산 함수
    // =========================================================================
    function updateSolarMetrics() {
      // 하지(π/2)에서 적위 δ = +tilt, 동지(3π/2)에서 δ = -tilt
      // orbitAngle에 따른 태양 적위 공식: declination = tilt * sin(orbitAngle)
      const currentDeclination = tiltDegree * Math.sin(orbitAngle);
      const lat = 37.5; // 서울 위도

      // 남중고도 공식: h = 90° - 위도 + 태양적위
      let altitude = 90 - lat + currentDeclination;
      altitude = Math.max(0, Math.min(90, altitude));

      // 단위 면적당 도달하는 태양 복사 에너지 밀도 = sin(남중고도) * 100%
      const energyPercent = Math.max(0, Math.sin(THREE.MathUtils.degToRad(altitude)) * 100);

      // HUD 업데이트
      altitudeVal.innerText = `${altitude.toFixed(1)}° (${altitude > 65 ? '높음' : (altitude < 40 ? '낮음' : '보통')})`;
      energyVal.innerText = `${Math.round(energyPercent)}% (${energyPercent > 85 ? '매우 강함' : (energyPercent < 60 ? '약함' : '적당함')})`;
      energyBar.style.width = `${energyPercent}%`;

      // 계절 텍스트 및 설명 업데이트
      let seasonName = "";
      let explainText = "";
      const modAngle = ((orbitAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

      if (Math.abs(modAngle - Math.PI / 2) < 0.35) {
        seasonName = "여름 (하지 부근)";
        explainText = "태양 남중고도가 높아 햇빛이 가파르게 내리쬡니다. 좁은 면적에 많은 에너지가 집중되어 기온이 높아집니다.";
      } else if (Math.abs(modAngle - 3 * Math.PI / 2) < 0.35) {
        seasonName = "겨울 (동지 부근)";
        explainText = "태양 남중고도가 낮아 햇빛이 비스듬하게 비춥니다. 에너지가 넓은 면적으로 분산되어 단위면적당 에너지가 적고 기온이 낮아집니다.";
      } else if (Math.abs(modAngle - Math.PI) < 0.35) {
        seasonName = "봄 (춘분 부근)";
        explainText = "태양의 남중고도와 단위면적당 에너지가 온화하여 따뜻한 봄 날씨가 나타납니다.";
      } else {
        seasonName = "가을 (추분 부근)";
        explainText = "낮과 밤의 길이가 같고 적당한 태양 에너지가 도달하여 선선한 가을 날씨가 나타납니다.";
      }

      hudSeasonBadge.innerText = seasonName;
      hudExplain.innerText = explainText;

      // 태양 직사광선 레이저 빔 위치 갱신
      if (mainEarth.sunBeamLine && mainEarth.pivot.visible) {
        const pinWorldPos = new THREE.Vector3();
        mainEarth.pinGroup.getWorldPosition(pinWorldPos);
        
        // 태양 표면에서 한국 핀으로 꽂히는 광선
        const sunWorldPos = new THREE.Vector3(0, 0, 0);
        const dir = pinWorldPos.clone().sub(sunWorldPos).normalize();
        const beamStart = sunWorldPos.clone().add(dir.multiplyScalar(8.5)); // 태양 표면

        const positions = mainEarth.sunBeamLine.geometry.attributes.position.array;
        positions[0] = beamStart.x; positions[1] = beamStart.y; positions[2] = beamStart.z;
        positions[3] = pinWorldPos.x; positions[4] = pinWorldPos.y; positions[5] = pinWorldPos.z;
        mainEarth.sunBeamLine.geometry.attributes.position.needsUpdate = true;
      }
    }

    // 8. 렌더 루프
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 배경 돔 미세 회전
      universeSkyMesh.rotation.y = time * 0.0003;

      // 반시계 방향 공전
      if (isPlaying && !isAllSeasonsMode) {
        orbitAngle -= 0.1 * delta;
        if (orbitAngle < 0) orbitAngle += 2 * Math.PI;
      }
      mainEarth.pivot.position.x = orbitRadius * Math.cos(orbitAngle);
      mainEarth.pivot.position.z = orbitRadius * Math.sin(orbitAngle);

      // 관측 핀이 항상 태양 쪽(남중 정오 시간대)을 마주보도록 정렬하여 고도 관찰 극대화
      mainEarth.mesh.rotation.y = 0; 
      staticEarths.forEach(u => u.mesh.rotation.y = 0);

      // 태양 자전
      sunMesh.rotation.y += 0.02 * delta;

      // 실시간 남중고도 및 에너지 밀도 계산
      updateSolarMetrics();

      controls.update();
      renderer.render(scene, activeCamera);
    }

    animate();
  </script>
</body>
</html>
